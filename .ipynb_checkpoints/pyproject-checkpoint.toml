[project]
name = "llm-zc-2026-code"
version = "0.1.0"
description = "LLM + RAG to fetch PDF data"
readme = "README.md"
authors = [
    { name = "Jean Gane Sarr", email = "65091001+jsgane@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "openai>=2.52.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
llm-zc-2026-code = "llm_zc_2026_code:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
